<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
      .num-two-icon {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 88px;
        font-weight: 600;
        fill: #34D399;
      }
    </style>
  </defs>

  <!-- Squircle Icon Background -->
  <rect x="20" y="55" width="130" height="130" rx="34" ry="34" fill="#ECEBFD" />

  <!-- Branches -->
  <line x1="64" y1="94" x2="85" y2="120" stroke="#1E1E4B" stroke-width="11" stroke-linecap="round" />
  <line x1="106" y1="94" x2="85" y2="120" stroke="#1E1E4B" stroke-width="11" stroke-linecap="round" />
  <line x1="85" y1="120" x2="106" y2="146" stroke="#10B981" stroke-width="11" stroke-linecap="round" />

  <!-- Nodes -->
  <circle cx="64" cy="94" r="9" fill="#1E1E4B" />
  <circle cx="106" cy="94" r="9" fill="#1E1E4B" />
  <circle cx="85" cy="120" r="10" fill="#FFFFFF" stroke="#1E1E4B" stroke-width="4.5" />
  <circle cx="106" cy="146" r="9" fill="#10B981" />

  <!-- Accents -->
  <circle cx="58" cy="146" r="8" fill="none" stroke="#34D399" stroke-width="3.5" />
  <circle cx="58" cy="146" r="2.2" fill="#34D399" />
  <circle cx="72" cy="132" r="3" fill="#6EE7B7" />

  <!-- Numeral 2 -->
  <text x="162" y="152" class="num-two-icon">2</text>
</svg>
